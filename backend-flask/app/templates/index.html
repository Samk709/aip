<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mental Health Assistant</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <main>
    <h1>Mental Health Risk + AI Chatbot (Enhanced Starter)</h1>
    <p>Register/login, assess PHQ risk, run multimodal analysis, and chat.</p>

    <section>
      <h2>Auth</h2>
      <input id="name" placeholder="Name" value="Student" />
      <input id="email" placeholder="Email" value="student@example.com" />
      <input id="password" type="password" placeholder="Password" value="pass1234" />
      <select id="lang">
        <option value="en">English</option>
        <option value="hi">Hindi</option>
      </select>
      <button onclick="registerUser()">Register</button>
      <button onclick="loginUser()">Login</button>
      <p id="uid"></p>
    </section>

    <section>
      <h2>Assessment</h2>
      <input id="phq" type="number" min="0" max="27" value="8" />
      <button onclick="assess()">Run Assessment</button>
      <pre id="assessmentResult"></pre>
    </section>

    <section>
      <h2>Multimodal</h2>
      <input id="face" placeholder="face emotion (happy/sad/neutral)" value="sad" />
      <input id="energy" type="number" step="0.1" min="0" max="1" value="0.7" />
      <input id="pitch" type="number" step="0.1" min="0" max="1" value="0.6" />
      <button onclick="analyzeMultimodal()">Analyze</button>
      <pre id="multiResult"></pre>
    </section>

    <section>
      <h2>Chat</h2>
      <input id="msg" placeholder="Type message" value="I feel anxious today" />
      <button onclick="chat()">Send</button>
      <pre id="chatResult"></pre>
    </section>
  </main>
  <script src="/static/js/app.js"></script>
</body>
</html>
