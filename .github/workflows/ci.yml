name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend-flask/requirements.txt
      - name: Check merge conflict markers
        run: ./scripts/check_conflict_markers.sh
      - name: Compile check
        run: python -m compileall backend-flask rasa-bot
      - name: Run API tests
        run: |
          cd backend-flask
          PYTHONPATH=. pytest -q
